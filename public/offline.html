<!doctype html>
<!--
  Shown by public/sw.js when a page navigation fails for lack of network.
  Fully self-contained (inline CSS, only the pre-cached icon) because nothing
  else is guaranteed to be available offline. Deliberately shows NO products or
  prices — see docs/14-pwa.md. Bump CACHE_VERSION in sw.js after editing.
-->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Anda sedang offline — HNS IT Center</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --fg: #0d2959;
        --muted: #5b6b85;
        --primary: #2166de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07142c;
          --card: #0d2959;
          --fg: #e9f0fc;
          --muted: #a6c2f2;
          --primary: #4e85e4;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(13, 41, 89, 0.08);
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="HNS IT Center" />
      <h1>Anda sedang offline</h1>
      <p>
        Koneksi internet terputus. Periksa jaringan Anda, lalu coba lagi untuk melihat produk dan
        harga terbaru HNS IT Center.
      </p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
    <script>
      // Reload by itself once the connection is back.
      window.addEventListener("online", function () { location.reload() })
    </script>
  </body>
</html>
